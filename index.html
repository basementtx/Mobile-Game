<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Crown &amp; Dagger</title>
  <meta name="theme-color" content="#14100c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Bir betik yüklenemez ya da çözümlenemezse boş ekran yerine hatayı göster */
    window.__bootErr = [];
    window.addEventListener('error', function (e) {
      if (window.BOOT_OK) return;
      window.__bootErr.push((e.message || 'Error') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      var m = document.querySelector('.boot-msg');
      if (m) { m.textContent = 'Hata / Error: ' + window.__bootErr[0]; m.style.color = '#f0998f'; }
    });
  </script>
</head>
<body>
  <!-- @@BODY -->
  <div id="setup" class="screen"><div class="boot"><div class="boot-logo">⚜</div><h1>Taç ve Hançer</h1><p class="boot-msg">Yükleniyor… · Loading…</p><div class="boot-bar"><i></i></div></div></div>
  <div id="game" class="screen hidden">
    <canvas id="mapcv"></canvas>
    <div id="hudL" class="hud"></div>
    <div id="hudR" class="hud"></div>
    <div id="lb" class="hud"></div>
    <div id="atks" class="hud"></div>
    <div id="status" class="hidden"></div>
    <nav id="tools"></nav>
    <div id="ctrl" class="hud"></div>
    <div id="pop" class="hidden"></div>
    <aside id="drawer" class="hidden"><header><span class="dtitle"></span><button class="dx" aria-label="Close">✕</button></header><div class="dbody"></div></aside>
  </div>
  <div id="modal" class="hidden"></div>
  <div id="rotate" class="hidden"><div><div class="rot">📱↻</div><h2>Rotate your phone</h2><p>Crown &amp; Dagger is played in landscape.</p><button class="ghost">Continue in portrait anyway</button></div></div>
  <!-- @@END -->
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/flags.js"></script>
  <script src="js/data.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/world.js"></script>
  <script src="js/front.js"></script>
  <script src="js/realm.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/events.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/audience.js"></script>
  <script src="js/portrait.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui2.js"></script>
  <script src="js/fmap.js"></script>
  <script src="js/fui.js"></script>
  <script src="js/family.js"></script>
</body>
</html>
